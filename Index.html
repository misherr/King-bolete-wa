<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2419">
<title>Bolete Washington</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --moss:#1a2419; --moss-2:#243226; --bark:#4a3a2a; --cap:#b8742c; --cap-light:#e0a559;
  --pore:#e9e2cf; --pore-dim:#b8b09a; --line:rgba(233,226,207,.14);
  --c-med:#e2c452; --c-good:#e58a2b; --c-high:#d6432c; --c-vhigh:#8a1a30;
  --sheet-h:46dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--moss);color:var(--pore);
  font-family:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.4;overscroll-behavior:none}
#map{position:fixed;inset:0;background:#0f150f}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:9px;background:rgba(26,36,25,.7)!important;color:var(--pore-dim)!important}
.leaflet-control-attribution a{color:var(--cap-light)!important}
.leaflet-control-zoom{display:none}

/* top strip */
#top{position:fixed;top:0;left:0;right:0;z-index:900;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  display:flex;align-items:center;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#brand{background:var(--moss);border:1px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column;min-width:0;flex:1}
#brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--pore)}
#brand h1 em{font-style:normal;color:var(--cap-light)}
#brand small{font-size:12px;color:var(--pore-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--moss);border:1px solid var(--line);color:var(--pore);border-radius:14px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill:active{background:var(--moss-2)}
.pill.cap{background:var(--cap);border-color:var(--cap);color:#1a1208}
.pill[disabled]{opacity:.5}

/* right rail */
#rail{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 70px);z-index:900;display:flex;flex-direction:column;gap:8px}
#rail button{width:44px;height:44px;border-radius:12px;background:var(--moss);border:1px solid var(--line);color:var(--pore);font-size:20px;cursor:pointer;display:grid;place-items:center}
#rail button:active{background:var(--moss-2)}
#rail button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* legend */
#legend{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:900;background:var(--moss);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--pore-dim);display:flex;gap:10px;align-items:center;transition:transform .25s}
#legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
body.sheet-open #legend{transform:translateY(calc(-1 * var(--sheet-h)))}

/* progress */
#prog{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:900;background:var(--moss);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;display:none;transition:transform .25s}
#prog .bar{height:4px;border-radius:2px;background:var(--moss-2);margin-top:6px;overflow:hidden}
#prog .bar b{display:block;height:100%;width:0;background:var(--cap-light);transition:width .2s}
body.sheet-open #prog{transform:translateY(calc(-1 * var(--sheet-h)))}

/* bottom sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheet-h);z-index:950;background:var(--moss);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
#sheet.open{transform:translateY(0)}
#sheet.tall{--sheet-h:88dvh}
#grab{width:38px;height:4px;border-radius:2px;background:var(--pore-dim);opacity:.6;margin:8px auto 4px;flex:none}
#sheet-hd{display:flex;align-items:flex-start;gap:10px;padding:4px 16px 8px;flex:none}
#sheet-hd .t{flex:1;min-width:0}
#sheet-hd .t h2{margin:0;font-size:16px;font-weight:600;line-height:1.25}
#sheet-hd .t small{color:var(--pore-dim);font-size:12px}
#close{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--pore);font-size:16px;cursor:pointer}
#sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(env(safe-area-inset-bottom) + 20px);flex:1}

.verdict{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--moss-2);margin-bottom:12px}
.verdict .num{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;min-width:76px}
.verdict .num small{display:block;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--pore-dim);margin-top:4px}
.verdict p{margin:0;font-size:14px;line-height:1.35}
.verdict p b{font-weight:600}

.sec{margin:14px 0 6px;font-size:12px;color:var(--pore-dim);font-weight:600}
.bars{display:grid;grid-template-columns:118px 1fr 40px;gap:6px 10px;align-items:center;font-size:13px}
.bars .bg{height:8px;border-radius:4px;background:var(--moss-2);overflow:hidden}
.bars .bg b{display:block;height:100%;border-radius:4px;background:var(--cap-light)}
.bars .v{text-align:right;color:var(--pore-dim);font-variant-numeric:tabular-nums}
.bars .k{color:var(--pore)}
.note{font-size:12.5px;color:var(--pore-dim);margin:6px 0 0}

.fc{display:flex;gap:4px;align-items:flex-end;height:74px;margin-top:6px}
.fc div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:10px;color:var(--pore-dim)}
.fc div b{width:100%;border-radius:4px 4px 2px 2px;min-height:2px}
.fc div.today span{color:var(--cap-light);font-weight:700}

.rain{display:flex;gap:3px;align-items:flex-end;height:54px;margin-top:6px}
.rain div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;gap:2px;font-size:9px;color:var(--pore-dim)}
.rain div b{width:100%;background:#5b8fb0;border-radius:2px;min-height:1px}
.rain div.hi b{background:#7fb3d3}

dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0 0;font-size:13px}
dl dt{color:var(--pore-dim)}dl dd{margin:0}
a.lnk{color:var(--cap-light);text-decoration:none;font-weight:600}
.actions{display:flex;gap:8px;margin-top:12px}

/* top spots + model panels share sheet */
.spot{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.spot .sc{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:700;color:#fff;flex:none}
.spot .m{flex:1;min-width:0}.spot .m b{display:block;font-size:14px;font-weight:600}.spot .m span{font-size:12px;color:var(--pore-dim)}
.model p{font-size:13.5px;margin:8px 0}.model h3{font-size:14px;margin:16px 0 4px;color:var(--cap-light)}
.model ul{padding-left:18px;font-size:13px;margin:4px 0}.model li{margin:3px 0}

.cell{cursor:pointer}
.empty{padding:20px 0;color:var(--pore-dim);font-size:13.5px}
@media (prefers-reduced-motion:reduce){#sheet,#legend,#prog{transition:none}}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="brand"><h1><em>King bolete</em> Washington</h1><small id="status">Starting…</small></div>
  <button class="pill cap" id="btn-top">Top spots</button>
</div>

<div id="rail">
  <button id="btn-loc" title="My location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
  <button id="btn-base" title="Map style"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg></button>
  <button id="btn-refine" title="Refine this area" style="display:none"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/><path d="M11 8v6M8 11h6"/></svg></button>
  <button id="btn-model" title="How it works"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  <button id="btn-refresh" title="Refresh weather"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
</div>

<div id="legend">
  <span><i style="background:var(--c-med)"></i>Medium</span>
  <span><i style="background:var(--c-good)"></i>Good</span>
  <span><i style="background:var(--c-high)"></i>High</span>
  <span><i style="background:var(--c-vhigh)"></i>Very high</span>
</div>

<div id="prog"><span id="prog-txt"></span><div class="bar"><b id="prog-bar"></b></div></div>

<div id="sheet">
  <div id="grab"></div>
  <div id="sheet-hd"><div class="t"><h2 id="sh-title"></h2><small id="sh-sub"></small></div><button id="close">✕</button></div>
  <div id="sheet-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===================== CONFIG ===================== */
const COARSE = 0.2, FINE = 0.04, FINE_CAP = 320;
const PAST_DAYS = 30, FC_DAYS = 8;
const WA = [[-123.32,49.0],[-117.03,49.0],[-117.04,46.0],[-116.92,45.99],[-118.98,45.99],[-119.5,45.92],[-120.4,45.7],[-121.2,45.7],[-121.9,45.68],[-122.4,45.57],[-122.8,45.63],[-123.1,46.17],[-123.6,46.25],[-124.1,46.28],[-124.15,46.9],[-124.25,47.3],[-124.45,47.8],[-124.75,48.4],[-123.6,48.2],[-123.1,48.18],[-122.75,48.15],[-122.9,48.45],[-123.2,48.6],[-123.32,48.8]];
const CREST = [[45.5,-121.6],[46.2,-121.5],[46.9,-121.5],[47.4,-121.4],[47.9,-121.1],[48.5,-120.85],[49.0,-120.9]];
const BANDS = [[25,'Medium','#e2c452'],[45,'Good','#e58a2b'],[65,'High','#d6432c'],[80,'Very high','#8a1a30']];

/* ===================== HELPERS ===================== */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function interp(tbl,x){ if(x<=tbl[0][0])return tbl[0][1]; for(let i=1;i<tbl.length;i++){ if(x<=tbl[i][0]){const [x0,y0]=tbl[i-1],[x1,y1]=tbl[i];return lerp(y0,y1,(x-x0)/(x1-x0));}} return tbl[tbl.length-1][1]; }
function trap(x,a,b,c,d){ if(x<=a||x>=d)return 0; if(x<b)return (x-a)/(b-a); if(x<=c)return 1; return (d-x)/(d-c); }
const bell=(x,c,sd)=>Math.exp(-0.5*((x-c)/sd)**2);
function inWA(lat,lon){ let ins=false; for(let i=0,j=WA.length-1;i<WA.length;j=i++){ const [xi,yi]=WA[i],[xj,yj]=WA[j]; if((yi>lat)!==(yj>lat) && lon<(xj-xi)*(lat-yi)/(yj-yi)+xi) ins=!ins;} return ins; }
const crestLon=lat=>interp(CREST,lat);
function doyOf(d){ const s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
function localISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const fmtDay=iso=>{const d=new Date(iso+'T12:00:00');return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});};
const shortDay=iso=>new Date(iso+'T12:00:00').toLocaleDateString(undefined,{weekday:'narrow'});
const ft=m=>Math.round(m*3.28084);
const f=c=>Math.round(c*9/5+32);
const inch=mm=>(mm/25.4).toFixed(2);
function bandOf(s){ let b=null; for(const x of BANDS) if(s>=x[0]) b=x; return b; }
function colorOf(s){ const b=bandOf(s); return b?b[2]:null; }
function labelOf(s){ const b=bandOf(s); return b?b[1]:'Low'; }
function dist(a,b){ const R=6371,dl=(b[0]-a[0])*Math.PI/180,dn=(b[1]-a[1])*Math.PI/180; const x=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(x))*0.621371; }

/* ===================== HABITAT MODEL ===================== */
function habitat(lat,lon,elev,doy){
  const H={score:0,zone:'',hosts:'',elevNote:'',season:0,seasonNote:''};
  if(elev<3){H.zone='Water';return H;}
  const east = lon > crestLon(lat);
  const basin = lat>45.9&&lat<47.9&&lon>-120.6&&lon<-117.8&&elev<800;
  if(elev>2100){H.zone='Alpine / subalpine parkland';H.hosts='Above productive forest; sparse whitebark pine, subalpine fir krummholz';H.score=0.05;H.season=0.3;H.seasonNote='Too high and cold for reliable flushes';return H;}
  if(east && (elev<500 || basin)){H.zone='Shrub-steppe / farmland';H.hosts='No ectomycorrhizal conifer hosts';H.season=0;H.seasonNote='Not king bolete country';return H;}
  if(!east && elev<400 && (lon<-123.8 || (lat>48.0&&lon<-123.2))){
    H.zone='Coastal Sitka spruce belt';H.hosts='Sitka spruce, shore pine, western hemlock — dune forests, spruce fringe, campground edges';
    const s=trap(doy,255,278,330,355); H.season=s; H.seasonNote=s>=.9?'Coastal peak (Oct–Nov)':s>0?'Coastal season shoulder':'Coastal season is Oct–Nov';
    H.score=(elev<150?1:lerp(1,.55,(elev-150)/250))*Math.max(s,.08); H.elevNote='Best low, within a few miles of salt water'; return H;
  }
  if(!east && elev<350){
    H.zone='Puget / Chehalis lowland';H.hosts='Mostly Douglas-fir (weak host). Look for planted Sitka spruce, pines and true firs in parks, campuses, shelterbelts';
    const s=trap(doy,272,290,330,342); H.season=s; H.seasonNote=s>0?'Lowland season (Oct–Nov)':'Lowland flushes run Oct–Nov';
    H.score=0.3*Math.max(s,.08); H.elevNote='Spotty; habitat matters more than weather here'; return H;
  }
  if(!east){
    H.zone= (lon<-123.0&&lat>47.3)?'Olympic montane forest':'West Cascades montane forest';
    H.hosts='Pacific silver fir, noble fir, grand fir, western/mountain hemlock, western white pine; Engelmann spruce near the crest. Openings, road cuts, campgrounds under true fir are classic';
    const s=trap(doy,220,237,288,306); const c=interp([[220,1450],[258,1150],[288,800],[319,450]],doy);
    const e=0.3+0.7*bell(elev,c,350)*(elev>1800?0.6:1); H.season=s; H.score=Math.max(s,.06)*e;
    H.seasonNote=s>=.9?'Fall montane peak (late Aug–mid Oct)':s>0?'Fall season shoulder':'Fall season Aug–Oct';
    H.elevNote=`Sweet spot today ≈ ${ft(c-350)}–${ft(c+350)} ft, drifting downslope as fall goes on`; return H;
  }
  // east side
  const hi=elev>=750;
  H.zone= lat<46.8&&lon>-118.6?'Blue Mountains':(lat>47.5&&lon>-119.2?'Okanogan / Selkirk highlands':'East Cascades');
  H.hosts= hi?'Grand fir, subalpine fir, Engelmann spruce, lodgepole & western white pine, Douglas-fir, larch mixes. Spring kings (B. rex-veris) under true fir/pine near snowmelt; fall B. edulis under spruce/fir':'Ponderosa pine / Douglas-fir transition — spring kings possible, fall spotty';
  const fs=trap(doy,236,250,293,306); const fc=interp([[236,1500],[262,1300],[290,1000],[306,750]],doy);
  const fe=0.3+0.7*bell(elev,fc,350);
  const ss=trap(doy,128,140,176,192); const scn=interp([[128,800],[160,1250],[192,1650]],doy);
  const se=0.3+0.7*bell(elev,scn,300);
  const fall=fs*fe, spring=ss*se;
  H.season=Math.max(fs,ss);
  H.score=(hi?1:0.35)*Math.max(fall,spring,.06);
  if(ss>0&&spring>=fall){H.seasonNote=ss>=.9?'Spring king peak (late May–June)':'Spring king shoulder';H.elevNote=`Spring kings follow the snowline; ≈ ${ft(scn-300)}–${ft(scn+300)} ft now`;}
  else {H.seasonNote=fs>=.9?'Fall east-side peak (Sept–mid Oct)':fs>0?'Fall season shoulder':'Fall season Sept–Oct; spring kings May–June';H.elevNote=`Sweet spot today ≈ ${ft(fc-350)}–${ft(fc+350)} ft`;}
  return H;
}

/* ===================== WEATHER SCORE MODEL ===================== */
function kernel(a){ if(a<3)return 0; if(a<9)return (a-3)/6; if(a<=15)return 1; if(a<24)return (24-a)/9; return 0; }
function tmaxSuit(t){ if(t<=2)return 0; if(t<10)return (t-2)/8; if(t<=22)return 1; if(t<30)return (30-t)/8; return 0; }
function tminSuit(t){ if(t<=-2)return 0; if(t<3)return (t+2)/5; if(t<=13)return 1; if(t<19)return (19-t)/6; return 0; }
function analyze(w,i,hab){
  const {p,tmax,tmin,et0,snow,rh}=w; const n=p.length;
  const at=(arr,k)=>arr[clamp(k,0,n-1)]??0;
  // flush trigger: best rain event 3–24 days before i
  let F=0,ev=null;
  for(let d=Math.max(2,i-24);d<=i-3;d++){ const P3=at(p,d)+at(p,d-1)+at(p,d-2); const m=clamp((P3-10)/30,0,1); const v=m*kernel(i-d); if(v>F){F=v;ev={age:i-d,mm:P3,date:w.time[d]};} }
  // most recent meaningful rain (any age)
  let last=null; for(let d=i;d>=Math.max(2,i-30);d--){ const P3=at(p,d)+at(p,d-1)+at(p,d-2); if(P3>=10){last={age:i-d,mm:P3,date:w.time[d]};break;} }
  // soil bucket
  let S=20; for(let d=Math.max(0,i-30);d<=i;d++){ S=clamp(S+at(p,d)-0.7*(et0[d]??3),0,80); } const M=clamp(S/40,0,1);
  let dry=0; for(let d=i;d>=0&&at(p,d)<1;d--)dry++;
  // temperature (last 5 days)
  let X=0,c=0; for(let d=i-4;d<=i;d++){ if(d<0)continue; X+=tmaxSuit(at(tmax,d))*tminSuit(at(tmin,d)); c++; } X=c?X/c:0.5;
  let K=1,kill=null; let mn=99,sn=0,mx=-99;
  for(let d=i-6;d<=i;d++){ if(d<0)continue; mn=Math.min(mn,at(tmin,d)); sn+=snow[d]??0; }
  for(let d=i-2;d<=i;d++){ if(d<0)continue; mx=Math.max(mx,at(tmax,d)); }
  if(sn>=3){K=0.05;kill='snow';} else if(mn<=-3){K=0.15;kill='frost';} else if(mx>=30){K=0.5;kill='heat';}
  let rhm=null,rc=0,rs=0; for(let d=i-2;d<=i;d++){ if(d<0)continue; if(rh&&rh[d]!=null){rs+=rh[d];rc++;} } if(rc){rhm=rs/rc;}
  const Hu= rhm==null?0.75:0.2+0.8*clamp((rhm-40)/30,0,1);
  let tm1=0,tm2=0,c1=0,c2=0; for(let d=i-3;d<=i;d++){if(d>=0){tm1+=(at(tmax,d)+at(tmin,d))/2;c1++;}} for(let d=i-9;d<=i-4;d++){if(d>=0){tm2+=(at(tmax,d)+at(tmin,d))/2;c2++;}}
  const drop=(c1&&c2)?(tm2/c2-tm1/c1):0; const C= drop>=2?0.1:0;
  const score=clamp(100*hab.score*Math.pow(F,0.6)*Math.pow(M,0.4)*X*Math.sqrt(Hu)*K*(1+C),0,100);
  return {score,F,M,X,Hu,K,C,kill,ev,last,dry,bucket:S,rh:rhm,mn,mx,drop};
}
function fullAnalysis(w,hab){
  const i=w.today; const now=analyze(w,i,hab);
  const fut=[]; for(let t=0;t<=7&&i+t<w.time.length;t++){ fut.push({date:w.time[i+t],score:analyze(w,i+t,hab).score,rain:w.p[i+t]}); }
  let best=fut[0]; for(const x of fut) if(x.score>best.score+0.5) best=x;
  const fRain=fut.slice(1).reduce((a,x)=>a+(x.rain||0),0);
  return {now,fut,best,fRain,hab};
}
function verdict(A){
  const {now,fut,best,fRain,hab}=A; const s=Math.round(now.score); const bs=Math.round(best.score);
  const lab=labelOf(s).toLowerCase();
  if(hab.score===0) return `Not king bolete habitat — ${hab.zone.toLowerCase()}.`;
  if(hab.season<0.15) return `Out of season here. ${hab.seasonNote}.`;
  if(now.kill==='snow') return `Snow on the ground. Fall flush is over at this elevation.`;
  if(now.kill==='frost') return `Hard frost in the last week (${f(now.mn)}°F). The fall flush is over here — look lower or on the coast.`;
  const evTxt=now.ev?`${inch(now.ev.mm)}" of rain ${now.ev.age} days ago`:null;
  if(s>=65) return `<b>Prime right now.</b> ${evTxt?evTxt+' is producing':'Steady moisture is producing'}; temps ${f(now.mn)}–${f(now.mx)}°F. Go.`;
  if(bs>=s+10 && bs>=30){
    const lastTxt=now.last&&now.last.age<=6?`It rained ${inch(now.last.mm)}" ${now.last.age===0?'today':now.last.age+' days ago'}.`:(fRain>8?`${inch(fRain)}" of rain is forecast.`:'');
    return `${lastTxt} Chances are <b>${lab}</b> today (${s}%) but should climb to <b>${labelOf(bs).toLowerCase()}</b> (${bs}%) around ${fmtDay(best.date)} as the flush comes up.`;
  }
  if(now.ev&&now.ev.age>15&&s<45) return `<b>Past prime.</b> The flush from ${inch(now.ev.mm)}" on ${fmtDay(now.ev.date)} is ${now.ev.age} days old and fading — you may find older, buggy caps. Needs new rain.`;
  if(now.F===0&&now.dry>=10) return `<b>Dry.</b> No trigger rain (≥1") in the last ${now.dry} days and soil moisture is ${Math.round(now.M*100)}%. Not worth the drive.`;
  if(now.F===0) return `No flush trigger yet — the last real soak was too recent or too light. Watch the forecast; a 1" storm followed by 7–12 cool days is what you want.`;
  if(now.kill==='heat') return `Rain history is fine but highs near ${f(now.mx)}°F are shutting fruiting down. Wait for the cool-down.`;
  if(now.X<0.4) return `Moisture is there, but temperatures (${f(now.mn)}–${f(now.mx)}°F) are outside the fruiting window. Marginal.`;
  return `<b>${labelOf(s)}</b> chance. ${evTxt?evTxt+', soil moisture '+Math.round(now.M*100)+'%.':''} ${bs>s?`Slightly better around ${fmtDay(best.date)}.`:'Trend is flat to declining.'}`;
}

/* ===================== DATA ===================== */
const cache=new Map(); // key -> {lat,lon,elev,w,hab,A}
const key=(lat,lon)=>lat.toFixed(3)+','+lon.toFixed(3);
let RH_OK=true;
async function fetchElev(pts){ const out=[]; for(let i=0;i<pts.length;i+=100){ const b=pts.slice(i,i+100); const u=`https://api.open-meteo.com/v1/elevation?latitude=${b.map(p=>p[0].toFixed(3)).join(',')}&longitude=${b.map(p=>p[1].toFixed(3)).join(',')}`; const r=await fetch(u); if(!r.ok)throw new Error('elevation '+r.status); const j=await r.json(); out.push(...j.elevation);} return out; }
async function fetchWeather(pts){
  const vars=['precipitation_sum','temperature_2m_max','temperature_2m_min','et0_fao_evapotranspiration','snowfall_sum'];
  const tryVars=RH_OK?[...vars,'relative_humidity_2m_mean']:vars;
  const u=v=>`https://api.open-meteo.com/v1/forecast?latitude=${pts.map(p=>p[0].toFixed(3)).join(',')}&longitude=${pts.map(p=>p[1].toFixed(3)).join(',')}&daily=${v.join(',')}&past_days=${PAST_DAYS}&forecast_days=${FC_DAYS}&timezone=America%2FLos_Angeles`;
  let r=await fetch(u(tryVars));
  if(!r.ok && RH_OK){ RH_OK=false; r=await fetch(u(vars)); }
  if(!r.ok) throw new Error('weather '+r.status);
  let j=await r.json(); if(!Array.isArray(j)) j=[j];
  const today=localISO(new Date());
  return j.map(x=>{ const d=x.daily; let ti=d.time.indexOf(today); if(ti<0) ti=Math.min(PAST_DAYS,d.time.length-1);
    return {time:d.time,p:d.precipitation_sum.map(v=>v??0),tmax:d.temperature_2m_max,tmin:d.temperature_2m_min,et0:d.et0_fao_evapotranspiration||[],snow:d.snowfall_sum||[],rh:d.relative_humidity_2m_mean||null,today:ti,elev:x.elevation}; });
}
const DOY=doyOf(new Date());
async function scorePoints(pts,onProgress){
  // pts: [[lat,lon]] -> array of cache entries
  const need=pts.filter(p=>!cache.has(key(p[0],p[1])));
  if(need.length){
    onProgress&&onProgress('Reading terrain…',0.05);
    const el=await fetchElev(need);
    const todo=[];
    need.forEach((p,i)=>{ const hab=habitat(p[0],p[1],el[i],DOY); const e={lat:p[0],lon:p[1],elev:el[i],hab,w:null,A:null}; cache.set(key(p[0],p[1]),e); if(hab.score>0.08) todo.push(e); else e.A={now:{score:0},fut:[],best:{score:0},fRain:0,hab}; });
    const B=40; let done=0; const chunks=[]; for(let i=0;i<todo.length;i+=B) chunks.push(todo.slice(i,i+B));
    let idx=0; const worker=async()=>{ while(idx<chunks.length){ const c=chunks[idx++]; let ws; try{ ws=await fetchWeather(c.map(e=>[e.lat,e.lon])); }catch(err){ console.warn(err); ws=null; } c.forEach((e,i)=>{ if(ws&&ws[i]){ e.w=ws[i]; e.A=fullAnalysis(e.w,e.hab);} else { cache.delete(key(e.lat,e.lon)); } }); done+=c.length; onProgress&&onProgress(`Scoring ${done} of ${todo.length} forest cells…`,0.1+0.9*done/todo.length); } };
    await Promise.all([worker(),worker(),worker()]);
  }
  return pts.map(p=>cache.get(key(p[0],p[1]))).filter(Boolean);
}

/* ===================== MAP ===================== */
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([47.4,-121.2],7);
const bases={
  topo:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap, SRTM | OpenTopoMap'}),
  usgs:L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'USGS'}),
  sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri, Maxar, Earthstar'})
};
const baseOrder=['topo','usgs','sat']; let baseIdx=0; bases.topo.addTo(map);
const coarseLayer=L.layerGroup().addTo(map), fineLayer=L.layerGroup().addTo(map);
let marker=null, userLoc=null, fineBounds=null;

function drawCells(layer,entries,size){
  layer.clearLayers();
  for(const e of entries){ const s=e.A?e.A.now.score:0; const col=colorOf(s); if(!col) continue;
    const r=L.rectangle([[e.lat-size/2,e.lon-size/2],[e.lat+size/2,e.lon+size/2]],{color:col,weight:0,fillColor:col,fillOpacity:0.55,className:'cell'});
    r.on('click',ev=>{L.DomEvent.stop(ev);showPoint(e);}); r.addTo(layer); }
}
function gridPts(b,size){ const pts=[]; const la0=Math.floor(b.getSouth()/size)*size, lo0=Math.floor(b.getWest()/size)*size; for(let la=la0;la<=b.getNorth();la+=size) for(let lo=lo0;lo<=b.getEast();lo+=size){ const lat=+(la+size/2).toFixed(4), lon=+(lo+size/2).toFixed(4); if(inWA(lat,lon)) pts.push([lat,lon]); } return pts; }

const $=id=>document.getElementById(id);
function progress(txt,frac){ const p=$('prog'); if(txt==null){p.style.display='none';return;} p.style.display='block'; $('prog-txt').textContent=txt; $('prog-bar').style.width=Math.round(frac*100)+'%'; }
function setStatus(t){ $('status').textContent=t; }

let loading=false;
async function loadCoarse(){
  if(loading)return; loading=true; $('btn-refresh').disabled=true;
  try{
    const pts=gridPts(L.latLngBounds([[45.5,-124.8],[49.0,-116.9]]),COARSE);
    const entries=await scorePoints(pts,progress);
    drawCells(coarseLayer,entries,COARSE);
    const scored=entries.filter(e=>e.A&&e.A.now.score>=25).length;
    setStatus(`${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})} · ${scored} promising cells · updated ${new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}`);
  }catch(err){ setStatus('Weather data unavailable — check connection and refresh'); console.error(err); }
  progress(null); loading=false; $('btn-refresh').disabled=false;
}
async function refine(){
  if(loading)return; const b=map.getBounds(); let pts=gridPts(b,FINE);
  if(pts.length>FINE_CAP){ setStatus(`Zoom in a bit more — ${pts.length} cells in view (max ${FINE_CAP})`); return; }
  loading=true; try{ const entries=await scorePoints(pts,progress); drawCells(fineLayer,entries,FINE); fineBounds=b; setStatus(`Refined ${entries.length} cells at ~2.7 mi resolution`); }catch(err){ setStatus('Refine failed — try again'); } progress(null); loading=false;
}
map.on('zoomend moveend',()=>{ const z=map.getZoom(); $('btn-refine').style.display=z>=9?'grid':'none'; if(z>=9) coarseLayer.eachLayer(l=>l.setStyle({fillOpacity:0.3})); else coarseLayer.eachLayer(l=>l.setStyle({fillOpacity:0.55})); });
map.on('click',async ev=>{ const {lat,lng}=ev.latlng; if(!inWA(lat,lng)){setStatus('Outside Washington');return;}
  if(marker) marker.remove(); marker=L.circleMarker([lat,lng],{radius:7,color:'#fff',weight:2,fillColor:'#b8742c',fillOpacity:1}).addTo(map);
  openSheet('Checking this spot…',''); $('sheet-body').innerHTML='<div class="empty">Pulling 30 days of weather and the 7-day forecast for this exact point.</div>';
  try{ const [e]=await scorePoints([[+lat.toFixed(3),+lng.toFixed(3)]]); if(!e) throw 0; if(!e.w&&e.hab.score<=0.08){ showPoint(e); return; } showPoint(e); }
  catch(err){ $('sheet-body').innerHTML='<div class="empty">Could not load weather for this point. Check your connection and tap again.</div>'; }
});

/* ===================== SHEET ===================== */
const sheet=$('sheet');
function openSheet(title,sub,tall){ $('sh-title').innerHTML=title; $('sh-sub').textContent=sub; sheet.classList.toggle('tall',!!tall); sheet.classList.add('open'); document.body.classList.add('sheet-open'); $('sheet-body').scrollTop=0; }
function closeSheet(){ sheet.classList.remove('open'); document.body.classList.remove('sheet-open'); }
$('close').onclick=closeSheet;
$('grab').onclick=()=>sheet.classList.toggle('tall');
let ty=null; sheet.addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true}); sheet.addEventListener('touchend',e=>{ if(ty==null)return; const dy=e.changedTouches[0].clientY-ty; if(dy>70&&$('sheet-body').scrollTop<=0) { if(sheet.classList.contains('tall')) sheet.classList.remove('tall'); else closeSheet(); } else if(dy<-70) sheet.classList.add('tall'); ty=null; },{passive:true});

function bar(k,v,note){ return `<div class="k">${k}</div><div class="bg"><b style="width:${Math.round(v*100)}%"></b></div><div class="v">${Math.round(v*100)}</div>`; }
function showPoint(e){
  const A=e.A, hab=e.hab, s=A?Math.round(A.now.score):0; const col=colorOf(s)||'#6b7a6a';
  const title=`${hab.zone}`;
  const sub=`${e.lat.toFixed(3)}, ${e.lon.toFixed(3)} · ${ft(e.elev).toLocaleString()} ft${userLoc?' · '+Math.round(dist(userLoc,[e.lat,e.lon]))+' mi away':''}`;
  openSheet(title,sub,false);
  let h=`<div class="verdict"><div class="num" style="color:${col}">${s}%<small>${labelOf(s)}</small></div><p>${verdict(A)}</p></div>`;
  if(A&&A.fut&&A.fut.length){
    const mx=Math.max(20,...A.fut.map(x=>x.score));
    h+=`<div class="sec">Next 7 days</div><div class="fc">`+A.fut.map((x,i)=>`<div class="${i===0?'today':''}"><span>${Math.round(x.score)}</span><b style="height:${Math.max(3,Math.round(x.score/mx*46))}px;background:${colorOf(x.score)||'#3a4a3b'}"></b><span>${i===0?'Now':shortDay(x.date)}</span></div>`).join('')+`</div>`;
    if(A.fRain>0.5) h+=`<p class="note">${inch(A.fRain)}" of rain forecast over the next week${A.fRain>=20?' — a real trigger':A.fRain>=8?' — helps hold moisture':' — not enough to trigger a new flush'}.</p>`;
  }
  if(A&&A.now.F!==undefined){
    const n=A.now;
    h+=`<div class="sec">Why</div><div class="bars">`+bar('Trigger rain',n.F)+bar('Soil moisture',n.M)+bar('Temperatures',n.X)+bar('Humidity',n.Hu)+bar('Habitat & season',hab.score)+`</div>`;
    const bits=[];
    if(n.ev) bits.push(`Best trigger: ${inch(n.ev.mm)}" around ${fmtDay(n.ev.date)} (${n.ev.age} d ago; flushes peak 7–15 d after)`); else bits.push('No rain event ≥0.4" in the 3–24 day trigger window');
    bits.push(`Soil water index ${Math.round(n.bucket)}/80 mm · ${n.dry} dry day${n.dry===1?'':'s'} in a row`);
    bits.push(`Last 5 days ${f(n.mn)}–${f(n.mx)}°F${n.drop>=2?' · cooling trend (+)':''}${n.rh!=null?' · RH '+Math.round(n.rh)+'%':''}`);
    if(n.kill) bits.push(n.kill==='frost'?'Hard frost in the last week':n.kill==='snow'?'Fresh snow in the last week':'Heat ≥86°F in the last 3 days');
    h+=`<p class="note">${bits.join('<br>')}</p>`;
  }
  h+=`<div class="sec">Ecology</div><dl><dt>Hosts</dt><dd>${hab.hosts}</dd><dt>Season</dt><dd>${hab.seasonNote}</dd>${hab.elevNote?`<dt>Elevation</dt><dd>${hab.elevNote}</dd>`:''}</dl>`;
  if(e.w){
    const w=e.w,i=w.today; const days=[]; for(let d=Math.max(0,i-20);d<=i;d++) days.push(d); const mxp=Math.max(5,...days.map(d=>w.p[d]));
    h+=`<div class="sec">Rain, last 3 weeks (inches)</div><div class="rain">`+days.map(d=>`<div class="${w.p[d]>=10?'hi':''}"><b style="height:${Math.round(w.p[d]/mxp*38)}px"></b><span>${w.p[d]>=2.5?inch(w.p[d]).replace(/^0/,''):''}</span></div>`).join('')+`</div><p class="note">Left = 3 weeks ago, right = today. Lighter bars ≥0.4".</p>`;
  }
  h+=`<div class="actions"><a class="pill" href="https://maps.apple.com/?ll=${e.lat},${e.lon}&q=Bolete%20spot" target="_blank" rel="noopener">Open in Maps</a><a class="pill" href="https://www.google.com/maps/@${e.lat},${e.lon},14z/data=!3m1!1e3" target="_blank" rel="noopener">Satellite</a></div>`;
  $('sheet-body').innerHTML=h;
  map.panTo([e.lat,e.lon],{animate:true});
}

function showTop(){
  const all=[...cache.values()].filter(e=>e.A&&e.A.now.score>=25);
  const rising=[...cache.values()].filter(e=>e.A&&e.A.best&&e.A.best.score>=45&&e.A.best.score>=e.A.now.score+10);
  all.sort((a,b)=>b.A.now.score-a.A.now.score);
  const near=userLoc? all.slice().sort((a,b)=>dist(userLoc,[a.lat,a.lon])-dist(userLoc,[b.lat,b.lon])):null;
  openSheet('Where to go today','Best-scoring forest cells across the state',true);
  const row=e=>{const s=Math.round(e.A.now.score);return `<div class="spot" data-k="${key(e.lat,e.lon)}"><div class="sc" style="background:${colorOf(s)}">${s}</div><div class="m"><b>${e.hab.zone}</b><span>${ft(e.elev).toLocaleString()} ft · ${e.lat.toFixed(2)}, ${e.lon.toFixed(2)}${userLoc?' · '+Math.round(dist(userLoc,[e.lat,e.lon]))+' mi':''}${e.A.best.score>e.A.now.score+5?' · peaks '+fmtDay(e.A.best.date):''}</span></div></div>`;};
  let h='';
  if(!all.length) h+=`<div class="empty">Nothing at medium or better anywhere in the state right now. ${rising.length?'But conditions are building — see below.':'Check the forecast panel on a few spots to see when rain is coming.'}</div>`;
  else h+=`<div class="sec">Highest chance now</div>`+all.slice(0,8).map(row).join('');
  if(near&&near.length) h+=`<div class="sec">Closest to you (medium or better)</div>`+near.slice(0,5).map(row).join('');
  if(rising.length){ rising.sort((a,b)=>b.A.best.score-a.A.best.score); h+=`<div class="sec">Coming up this week</div>`+rising.slice(0,6).map(row).join(''); }
  h+=`<p class="note">Cells are ~14 mi wide. Zoom into one and tap Refine for ~2.7 mi cells, then tap exact spots for a point forecast.</p>`;
  $('sheet-body').innerHTML=h;
  $('sheet-body').querySelectorAll('.spot').forEach(el=>el.onclick=()=>{ const e=cache.get(el.dataset.k); map.setView([e.lat,e.lon],10); showPoint(e); });
}

function showModel(){
  openSheet('How the forecast works','Model notes and what to trust',true);
  $('sheet-body').innerHTML=`<div class="model">
<p>Each cell gets a 0–100 chance for <i>today</i> plus a 7-day projection, from live Open-Meteo weather (30 days of history + forecast for that exact point) combined with a habitat model of Washington's forests. Score = habitat × trigger rain × soil moisture × temperature window × humidity, with kill switches for frost, snow and heat.</p>
<h3>Trigger rain</h3><p>Fruiting is set off by a soaking rain event, not by general dampness. The model looks for the best 3-day rain total of at least 0.4", scoring fully at ~1.6", in a window 3–24 days back. A flush ramps up from day 3, peaks days 9–15, and fades out by ~24 days — the pattern reported in <i>Boletus edulis</i> phenology studies (Spain, Italy, Pacific Northwest) and matched by forager experience: "a week to ten days after the first big fall rain."</p>
<h3>Soil moisture</h3><p>A simple bucket: rain in, 70% of reference evapotranspiration out, capped at 80 mm. A flush needs moisture to persist while primordia expand; a hot dry stretch after the trigger aborts it. This is the "chances were high but it dried out" case.</p>
<h3>Temperature</h3><p>Best with highs 50–72°F and lows 37–55°F. Above ~86°F fruiting shuts down; a hard frost (≤27°F) ends the fall season at that elevation. A cooling trend of 3.5°F+ over the previous week adds a bonus — temperature drop after rain is one of the strongest signals in the literature.</p>
<h3>Humidity</h3><p>3-day mean relative humidity; ≥70% is ideal, below 40% dries caps and slows growth. Coastal fog belts score well here.</p>
<h3>Habitat and season</h3><ul>
<li><b>Coastal Sitka spruce belt</b> (Olympic coast, Grays Harbor, Long Beach, Strait) — Oct–Nov, low elevation, spruce and shore pine.</li>
<li><b>West Cascades / Olympic montane</b> — late Aug–mid Oct under true firs, hemlock, white pine. The productive elevation band drops from ~4,500 ft in August to ~2,000 ft by November; the model tracks that.</li>
<li><b>East Cascades, Okanogan, Selkirks, Blues</b> — fall under spruce/fir, plus the spring king (<i>B. rex-veris</i>) May–June following snowmelt upslope.</li>
<li><b>Puget lowland</b> — weighted low: Douglas-fir is a poor host; look for planted spruce, pine and fir.</li>
<li><b>Shrub-steppe and alpine</b> — scored near zero.</li></ul>
<p>The habitat layer uses elevation, position relative to the Cascade crest, and ecoregion — not stand-level forest data. A high cell can still be a clearcut or a Douglas-fir plantation. Use the topo (green = forest) and satellite basemaps to pick real stands of the host trees, then tap the exact spot for a point forecast.</p>
<h3>Reading the number</h3><ul><li>Medium 25–44 · Good 45–64 · High 65–79 · Very high 80+</li><li>"Rising" means the trigger has happened but the flush hasn't surfaced yet.</li><li>"Past prime" means you'll mostly find aged, maggoty caps.</li></ul>
<p>Sources of weather: Open-Meteo best-match model (NOAA GFS/HRRR blended with ICON, ERA5-based reanalysis for history). Mountain microclimates vary; treat any cell as a hypothesis, not a promise.</p></div>`;
}

/* ===================== CONTROLS ===================== */
$('btn-top').onclick=showTop;
$('btn-model').onclick=showModel;
$('btn-refine').onclick=refine;
$('btn-refresh').onclick=()=>{ cache.clear(); fineLayer.clearLayers(); loadCoarse(); };
$('btn-base').onclick=()=>{ bases[baseOrder[baseIdx]].remove(); baseIdx=(baseIdx+1)%baseOrder.length; bases[baseOrder[baseIdx]].addTo(map); setStatus(['Topo map','USGS topo','Satellite'][baseIdx]); };
$('btn-loc').onclick=()=>{ if(!navigator.geolocation){setStatus('Location not available');return;} setStatus('Finding you…'); navigator.geolocation.getCurrentPosition(pos=>{ userLoc=[pos.coords.latitude,pos.coords.longitude]; L.circleMarker(userLoc,{radius:6,color:'#fff',weight:2,fillColor:'#4a90d9',fillOpacity:1}).addTo(map); map.setView(userLoc,9); setStatus('Centered on your location'); },()=>setStatus('Location permission denied'),{enableHighAccuracy:false,timeout:10000}); };

loadCoarse();
</script>
